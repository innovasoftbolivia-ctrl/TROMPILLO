services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: aerolinea_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/zz-perf.ini:/usr/local/etc/php/conf.d/zz-perf.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aerolinea

  web:
    image: nginx:alpine
    container_name: aerolinea_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aerolinea

  db:
    image: mysql:8.0
    container_name: aerolinea_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aerolinea
      MYSQL_USER: aerolinea
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - aerolinea

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aerolinea_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - aerolinea

networks:
  aerolinea:
    driver: bridge

volumes:
  db_data:
