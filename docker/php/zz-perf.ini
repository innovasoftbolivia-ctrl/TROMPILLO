; Optimización de rendimiento — OPcache afinado para entorno con bind-mount (Docker en Windows)
; El mayor costo en Windows es el stat() por archivo en cada request; con validate_timestamps=0
; OPcache deja de revisar el disco y sirve el bytecode desde memoria.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.jit=tracing
opcache.jit_buffer_size=64M
opcache.save_comments=1
opcache.fast_shutdown=1

; Cache de rutas reales del filesystem (clave en bind-mounts lentos)
realpath_cache_size=8M
realpath_cache_ttl=600
